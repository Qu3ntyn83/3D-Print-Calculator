name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Server-Smoketest
        run: |
          DATA_DIR=$RUNNER_TEMP/data PORT=8080 node server/server.mjs &
          sleep 2
          curl -fsS http://localhost:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/data)" = "204"
          curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"lang":"de"}' http://localhost:8080/api/data
          curl -fsS http://localhost:8080/api/data | grep -q '"lang":"de"'
          curl -fsS http://localhost:8080/ | grep -q '3D Print Calculator'
