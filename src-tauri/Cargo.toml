[package]
name = "print-calculator"
version = "1.0.0"
description = "3D Print Calculator – Kostenrechner und Angebote für den 3D-Druck"
authors = ["Torsten Weise"]
license = "MIT"
repository = "https://github.com/Qu3ntyn83/3D-Print-Calculator"
edition = "2021"

[lib]
name = "print_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
